[package]
name = "rfb"
version = "0.1.0"
description = "Implementation of the RFB protocol (RFC 6143), including a server implementation."
repository = "https://github.com/oxidecomputer/rfb"
readme = "README.md"
authors = ["Jordan Paige Hendricks <jordan@oxide.computer"]
license = "MPL-2.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "rfb"
path = "src/lib.rs"

[[example]]
name = "example-server"
path = "examples/server.rs"
required-features = ["server"]

[[example]]
name = "client"
path = "examples/client.rs"

[features]
default = []
server = []

[dependencies]
ascii = { version = "1.1", default-features = false }
async-trait = "0.1.80"
bitflags = "2.4"
env_logger = "0.11"
# Pure-Rust (miniz_oxide) backend so it builds for wasm32 — used to inflate the
# persistent zlib stream of the VNC Zlib encoding (RFB 7.7.6).
flate2 = "1"
futures = "0.3.30"
log = "0.4.17"
thiserror = "1.0"
tokio = { version = "1", features = ["io-util"] }

[dev-dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
image = "0.25.1"
tokio = { version = "1", features = ["full"] }
png = "0.17.16"
